# Blueprint do Render: worker de importação + Redis (Key Value) para a fila.
# O site Next.js fica na Vercel e o banco no Supabase.
services:
  - type: worker
    name: catalogo-worker
    runtime: node
    plan: starter
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: NUVEMSHOP_APP_NAME
        sync: false
      - key: NUVEMSHOP_CONTACT_EMAIL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: catalogo-fila
          property: connectionString
  - type: keyvalue
    name: catalogo-fila
    plan: starter
    maxmemoryPolicy: noeviction # a fila não pode perder tarefas
    # A Vercel enfileira as importações pela URL externa (com senha e TLS).
    # A Vercel não tem IPs fixos nos planos comuns, por isso a liberação é ampla.
    ipAllowList:
      - source: 0.0.0.0/0
        description: vercel
