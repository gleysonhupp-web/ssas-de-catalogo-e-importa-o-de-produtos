# Blueprint do Render: worker de importação + Redis (Key Value) para a fila.
# O site Next.js fica na Vercel e o banco no Supabase.
# O worker roda como Web Service gratuito com uma rota de saúde; o UptimeRobot
# a consulta a cada 5 minutos para que o serviço não durma. Com cartão cadastrado,
# troque por "type: worker" (plano starter) e remova a dependência do UptimeRobot.
services:
  - type: web
    name: catalogo-worker
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci
    startCommand: npm run worker
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: NUVEMSHOP_APP_NAME
        sync: false
      - key: NUVEMSHOP_CONTACT_EMAIL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: catalogo-fila
          property: connectionString
  - type: keyvalue
    name: catalogo-fila
    plan: free
    region: virginia
    maxmemoryPolicy: noeviction # a fila não pode descartar tarefas
    ipAllowList: [] # só o worker (rede interna) acessa a fila
